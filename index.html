<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<title>101 Dalmatiens 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
/* ... (Style conservé, suppression du style .poke-nav si présent) ... */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --noir:#111;--noir2:#1a1a1a;--noir3:#222;
  --blanc:#fff;--grisclair:#f5f5f5;--grisfond:#e8e8e8;
  --rouge:#cc1111;--rouge2:#e82222;--rougefonce:#8b0000;
  --teal:#3dd6cc;--green:#2ecc71;
  --muted:rgba(0,0,0,0.45);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--noir);color:var(--noir);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;}
.screen.on{display:flex;}

/* ══ HOME ══ */
#sHome{background:#fff;justify-content:center;padding:20px 24px 30px;gap:0;position:relative;}
/* ... */
.btn-primary{
  background:var(--rouge2);color:#fff;
  border:3px solid var(--rougefonce);
  box-shadow:0 5px 0 var(--rougefonce),0 8px 20px rgba(180,0,0,0.3);
}

/* Suppression du style de la pokeball de navigation */
.poke-nav { display: none !important; } 
</style>
</head>
<body>

<div class="screen on" id="sHome">
  <div class="home-mascot">
    <svg viewBox="0 0 120 120"><use href="#dal-full"/></svg>
  </div>
  
  <h1 class="game-title">
    101<br>DALMATIENS
    <small>CHASSE AU TRÉSOR</small>
  </h1>

  <div class="score-box" onclick="show('sColl')">
    <span id="homeLabel">CHIOTS CAPTURÉS</span>
    <big id="homeScore">0 / 101</big>
  </div>

  <button class="btn btn-primary" onclick="startAR()">START</button>
  
  <button class="btn btn-secondary" onclick="show('sColl')">MON UGODEX</button>
  <button class="btn btn-ghost" onclick="show('sPrint')" style="margin-top:10px;font-size:14px;">Imprimer les QR Codes</button>
</div>

</body>
</html>
